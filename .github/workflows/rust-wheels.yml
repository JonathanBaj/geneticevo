name: Rust CPU wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
            interpreter: python3.10
          - os: macos-latest
            target: universal2-apple-darwin
            manylinux: auto
            interpreter: python
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: auto
            interpreter: python
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Test and lint Rust
        run: |
          rustup show
          cargo fmt --manifest-path rust/Cargo.toml --check
          cargo test --manifest-path rust/Cargo.toml --locked
          cargo clippy --manifest-path rust/Cargo.toml --locked --all-targets -- -D warnings
      - name: Build the stable-ABI wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --manifest-path rust/Cargo.toml --release --locked --out rust-wheelhouse --interpreter ${{ matrix.interpreter }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          rust-toolchain: "1.85.1"
          maturin-version: v1.16.0
      - name: Test installed wheel on Python 3.10
        shell: bash
        run: |
          python -m pip install rust-wheelhouse/*.whl "./[dev,rust]"
          python -c "import _geneticevo_rust"
          python -m pytest -q tests/test_rust_ppo.py
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Test the same wheel on Python 3.14
        shell: bash
        run: |
          python -m pip install rust-wheelhouse/*.whl "./[dev,rust]"
          python -c "import _geneticevo_rust"
          python -m pytest -q tests/test_rust_ppo.py
      - uses: actions/upload-artifact@v7
        with:
          name: geneticevo-core-${{ matrix.os }}
          path: rust-wheelhouse/*.whl
          if-no-files-found: error
