name: Rust CPU wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag to publish (for example v0.1.0a8). Leave empty for a test build.
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
            interpreter: python3.10
          - os: macos-latest
            target: universal2-apple-darwin
            manylinux: auto
            interpreter: python
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: auto
            interpreter: python
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Test and lint Rust
        run: |
          rustup show
          cargo fmt --manifest-path rust/Cargo.toml --check
          cargo test --manifest-path rust/Cargo.toml --locked
          cargo clippy --manifest-path rust/Cargo.toml --locked --all-targets -- -D warnings
      - name: Build the stable-ABI wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --manifest-path rust/Cargo.toml --release --locked --out rust-wheelhouse --interpreter ${{ matrix.interpreter }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          rust-toolchain: "1.85.1"
          maturin-version: v1.16.0
      - name: Test installed wheel on Python 3.10
        shell: bash
        run: |
          python -m pip install rust-wheelhouse/*.whl "./[dev,rust]"
          python -c "import _geneticevo_rust"
          python -m pytest -q tests/test_rust_ppo.py
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Test the same wheel on Python 3.14
        shell: bash
        run: |
          python -m pip install rust-wheelhouse/*.whl "./[dev,rust]"
          python -c "import _geneticevo_rust"
          python -m pytest -q tests/test_rust_ppo.py
      - uses: actions/upload-artifact@v7
        with:
          name: geneticevo-core-${{ matrix.os }}
          path: rust-wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish geneticevo-core to PyPI
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pypi-core-${{ inputs.release_tag || github.ref_name }}
      cancel-in-progress: false
    environment:
      name: pypi
      url: https://pypi.org/project/geneticevo-core/
    permissions:
      id-token: write
    steps:
      - name: Download the tested wheels
        uses: actions/download-artifact@v8
        with:
          pattern: geneticevo-core-*
          path: rust-wheelhouse/
          merge-multiple: true
      - name: Verify wheel versions match the release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: python
        run: |
          import os
          from pathlib import Path

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          prefix = f"geneticevo_core-{version}-"
          files = list(Path("rust-wheelhouse").iterdir())
          if not files or any(not wheel.is_file() or not wheel.name.startswith(prefix) or
                              wheel.suffix != ".whl" for wheel in files):
              raise SystemExit(f"Expected geneticevo-core wheels for {version}, found {files}")
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: rust-wheelhouse/
          skip-existing: true
