name: Release to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build release distributions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the release's tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Confirm release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: python
        run: |
          import ast
          import os
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          version = project["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag not in (version, f"v{version}"):
              raise SystemExit(f"Release tag {tag!r} must equal {version!r} or 'v{version}'.")
          module = ast.parse(Path("src/geneticevo/__init__.py").read_text(encoding="utf-8"))
          runtime_version = next(
              ast.literal_eval(node.value)
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)
          )
          if runtime_version != version:
              raise SystemExit(f"Package __version__ {runtime_version!r} differs from {version!r}.")
          print(f"Release tag and package versions match: {version}")

      - name: Install test and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.12,<2.13" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[dev,release,sb3,shared,plot]"
          python -m pip check

      - name: Verify optional test integrations import successfully
        run: |
          python -c "import torch, stable_baselines3, pettingzoo, matplotlib; from geneticevo.integrations.sb3 import SB3Learner; from geneticevo.integrations.pettingzoo import SignalParallelEnv; from geneticevo.ppo import NativePPO"

      - name: Run tests
        run: python -m pytest -q

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distributions
        run: python -m twine check --strict dist/*

      - name: Confirm only the intended release files will be transferred
        shell: python
        run: |
          from pathlib import Path
          import tomllib

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected = {
              f"geneticevo-{version}-py3-none-any.whl",
              f"geneticevo-{version}.tar.gz",
          }
          actual = {path.name for path in Path("dist").iterdir()}
          if actual != expected:
              raise SystemExit(f"Expected {sorted(expected)}, found {sorted(actual)}.")

      - name: Transfer distributions to the publishing job
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI with Trusted Publishing
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/geneticevo
    permissions:
      id-token: write
    steps:
      - name: Download the tested distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
