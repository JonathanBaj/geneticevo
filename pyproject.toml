[build-system]
requires = ["setuptools>=80,<82", "wheel>=0.45,<0.49"]
build-backend = "setuptools.build_meta"

[project]
name = "geneticevo"
version = "0.1.0a6"
description = "Reproducible evolutionary experiments with optional independent lifetime learning"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["evolution", "genetic-algorithms", "reinforcement-learning", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.26,<3", "gymnasium>=1.2,<1.3"]

[project.urls]
Homepage = "https://github.com/JonathanBaj/geneticevo"
Documentation = "https://github.com/JonathanBaj/geneticevo/blob/main/README.md"
Repository = "https://github.com/JonathanBaj/geneticevo"
Issues = "https://github.com/JonathanBaj/geneticevo/issues"
Changelog = "https://github.com/JonathanBaj/geneticevo/releases"

[project.optional-dependencies]
torch = ["torch>=2.12,<2.13"]
sb3 = ["stable-baselines3>=2.9,<2.10", "torch>=2.12,<2.13"]
shared = ["pettingzoo>=1.24,<1.26"]
plot = ["matplotlib>=3.10,<3.11"]
dev = ["pytest>=8,<10", "build>=1,<2"]
bench = ["psutil>=7,<8"]
release = ["build>=1,<2", "twine>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["geneticevo", "geneticevo.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

